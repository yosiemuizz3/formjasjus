<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Bongkar Zeuz</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; padding: 20px; display: flex; justify-content: center; }
       .container { background: #1e293b; padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        label { display: block; margin-top: 12px; margin-bottom: 5px; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
        input[readonly] { background: #334155; }
        button { width: 100%; padding: 12px; margin-top: 20px; background: #22c55e; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #status { text-align: center; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>FORM BONGKAR ZEUZ</h2>
        <form id="formZeuz">

            <label for="playerId">Player ID</label>
            <input type="text" id="playerId" required placeholder="Masukkan Player ID">

            <label for="jumlah">Jumlah Kartu</label>
            <input type="number" id="jumlah" required placeholder="Minimal 7 kartu">

            <label for="total">Total Diterima</label>
            <input type="text" id="total" readonly placeholder="Otomatis terhitung">

            <label for="bank">Bank Tujuan</label>
            <select id="bank" required>
                <option value="">Pilih Bank</option>
                <option value="BCA">BCA</option>
                <option value="BNI">BNI</option>
                <option value="BRI">BRI</option>
                <option value="Mandiri">Mandiri</option>
                <option value="Dana">Dana</option>
                <option value="OVO">OVO</option>
                <option value="Gopay">Gopay</option>
            </select>

            <label for="rek">No Rekening / No Ewallet</label>
            <input type="text" id="rek" required placeholder="No Rekening">

            <label for="namaRek">Atas Nama</label>
            <input type="text" id="namaRek" required placeholder="Nama Pemilik Rekening">

            <label for="wa">No WA Kamu</label>
            <input type="text" id="wa" required placeholder="08xxxxxxxxxx">

            <button type="submit" id="submitBtn">KIRIM DATA</button>
            <p id="status"></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
