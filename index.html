<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Bongkar Zeuz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <div class="syarat">
            <h2>SYARAT BONGKAR</h2>
            <p>1. Minimal 7 Kartu <br>
               2. Harga 50.000/Kartu - Admin 6.500 <br>
               3. Data harus benar
            </p>
        </div>

        <h1>FORM BONGKAR ZEUZ</h1>

        <form id="formZeuz">
            <label for="playerId">Player ID</label>
            <input type="text" id="playerId" required placeholder="Masukkan Player ID">

            <label for="jumlah">Jumlah Kartu</label>
            <input type="number" id="jumlah" required placeholder="Minimal 7 kartu">

            <label for="total">Total Diterima</label>
            <input type="text" id="total" readonly placeholder="Otomatis terhitung">

            <label for="bank">Bank / Ewallet Tujuan</label>
            <select id="bank" required>
                <option value="">Pilih Bank</option>
                <option value="BCA">BCA</option>
                <option value="BNI">BNI</option>
                <option value="BRI">BRI</option>
                <option value="Mandiri">Mandiri</option>
                <option value="Dana">Dana</option>
                <option value="OVO">OVO</option>
                <option value="Gopay">Gopay</option>
            </select>

            <label for="rek">No Rekening / No Ewallet</label>
            <input type="text" id="rek" required placeholder="No Rekening">

            <label for="namaRek">Atas Nama</label>
            <input type="text" id="namaRek" required placeholder="Nama Pemilik Rekening">

            <label for="wa">No WA Kamu</label>
            <input type="text" id="wa" required placeholder="08xxxxxxxxxx">

            <button type="submit" id="submitBtn">KIRIM DATA KE WA</button>
            <p id="status"></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
